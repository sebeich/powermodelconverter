[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powermodelconverter"
version = "0.1.0"
description = "Validation-first power system model conversion platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
dependencies = [
  "lxml>=6.0",
  "matpowercaseframes>=2.0.3",
  "numpy>=2.3",
  "opendssdirect.py>=0.9.4",
  "openpyxl>=3.1",
  "pandas>=2.3",
  "pandapower>=3.4.0",
  "pypsa>=1.1.2",
  "pytest>=9.0",
  "simbench>=1.6.1",
]

[project.optional-dependencies]
dev = []
# Solver stack for the UC2 paper reproduction: Pyomo drives the De Mel et al. (2024)
# model, HiGHS replaces CPLEX on the MILP. The NLP leg additionally needs an `ipopt`
# executable on PATH (replacing CONOPT); it is not pip-installable and is optional.
reproduction = [
  "highspy>=1.7",
  "pyomo>=6.7",
  "xlrd>=2.0",
]
ding0 = [
  "egoio>=0.4.8",
  "geopy>=2.1",
  "geopandas",
  "oedialect==0.0.10",
  "requests",
  "shapely",
  "sqlalchemy<1.4",
]

[project.scripts]
pmc = "powermodelconverter.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
